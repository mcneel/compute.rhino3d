# for a list of available software on the different virtual environments, please see:
# https://github.com/actions/virtual-environments/tree/main/images

name: workflow ci
on: 
  push: 
  pull_request: 
  workflow_dispatch:
  schedule:
    - cron: '0 0 1 * *'

permissions: {}

jobs:

  #checks if this file has changed
  check_workflow:
    name: check workflow_ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: check changed files
        uses: tj-actions/changed-files@v47
        id: changed-files
        with:
          files: .github/workflows/workflow_ci.yml

  #check if src has changed
  check_src:
    name: check src
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      any_changed: ${{ steps.changed-files.outputs.any_changed }}
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: check changed files
        uses: tj-actions/changed-files@v47
        id: changed-files
        with:
          files: src/**

  build_compute:
    name: build compute (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    needs: [check_workflow, check_src]
    if: ${{ needs.check_src.outputs.any_changed == 'true' || needs.check_workflow.outputs.any_changed == 'true' }}
    # Matrix over both runners so the csproj OS-conditionals produce a Windows-targeted build
    # on windows-latest (net10.0-windows + win-x64 + web.config) and a Linux-targeted build on
    # ubuntu-latest (net10.0 + linux-x64). The "rhino.compute" artifact name is preserved for
    # the Windows variant since it's the historical deliverable that downstream consumers
    # (e.g. the VM bootstrap script) reference by that exact name.
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: rhino.compute
          - os: ubuntu-latest
            artifact_name: rhino.compute-linux-x64
    steps:
      - name: checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: revision
        id: revision
        # shell: bash forces git-bash on windows-latest so ${GITHUB_SHA::9} substring works on
        # both hosts (default shell on windows-latest is pwsh, which doesn't recognise this).
        shell: bash
        run: |
          echo "revision=${GITHUB_SHA::9}" >> $GITHUB_OUTPUT
      - name: revision number
        shell: pwsh
        run: |
          echo ${{ steps.revision.outputs.revision }}
          (get-content .\src\compute.geometry\FixedEndpoints.cs).replace('git_sha = null', 'git_sha = "${{ steps.revision.outputs.revision }}"') | set-content .\src\compute.geometry\FixedEndpoints.cs
      - name: build
        run: dotnet publish src/compute.sln -c Release
      - name: artifacts
        if: github.ref == 'refs/heads/9.x'
        uses: actions/upload-artifact@v7
        with:
          path: src/dist
          name: ${{ matrix.artifact_name }}

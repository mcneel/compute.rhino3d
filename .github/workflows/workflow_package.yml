# for a list of available software on the different virtual environments, please see:
# https://github.com/actions/virtual-environments/tree/main/images

name: workflow package
on: 
  workflow_dispatch:
#  schedule:
#    - cron: '0 0 1 * *'

permissions: {}

jobs:
  version:
    if: github.ref == 'refs/heads/9.x'
    permissions:
      contents: read
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.102'

      - name: Update Version Numbers
        id: version_step
        run: ./package/version/version.sh

  build-deb:
    if: github.ref == 'refs/heads/9.x'
    permissions:
      contents: read
    name: build deb ${{ matrix.package_arch }}
    needs: [version]

    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: 'amd64'
            runtime_arch: 'x64'
            package_arch: 'amd64'
          - os: ubuntu-24.04
            architecture: 'arm64'
            runtime_arch: 'arm64'
            package_arch: 'arm64'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
         platforms: arm64

      - name: Install Tools (deb)
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts build-essential

      - name: Install dotnet 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.102'
    
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Rhino.Compute and Compute.Geometry
        run: |
          dotnet publish src/rhino.compute/rhino.compute.csproj -c Release -r linux-${{ matrix.runtime_arch }} --self-contained true -o publish/linux-${{ matrix.runtime_arch }}/rhino.compute
          dotnet publish src/compute.geometry/compute.geometry.csproj -c Release -r linux-${{ matrix.runtime_arch }} --self-contained true -o publish/linux-${{ matrix.runtime_arch }}/compute.geometry

      - name: Package (deb)
        run: |
          mkdir -p rhinocomputepackage/debian
          mkdir -p rhinocomputepackage/linux-${{ matrix.package_arch }}/build
          mv publish/linux-${{ matrix.runtime_arch }}/* rhinocomputepackage/linux-${{ matrix.package_arch }}/build/
          cp LICENSE.md package/rhino-compute.service package/environment.example package/rhino-compute-start.sh rhinocomputepackage/linux-${{ matrix.package_arch }}/build/
          cp package/deb/control package/deb/rules package/deb/changelog package/deb/copyright package/deb/postinst package/deb/postrm package/deb/prerm rhinocomputepackage/debian
          cd rhinocomputepackage
          dch -v ${{ needs.version.outputs.version }}-wip "Automated build" -M -D unstable
          dpkg-buildpackage -us -uc -b -a${{ matrix.package_arch }}

      - name: Deploy (deb)
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          DIST_PATH="dists/stable/main/binary-${{ matrix.package_arch }}"
          PACKAGE_NAME="rhino-compute_${{ needs.version.outputs.version }}-wip_${{ matrix.package_arch }}.deb"
          mkdir -p local-packages/deb/$DIST_PATH
          cp $PACKAGE_NAME local-packages/deb/$DIST_PATH
          cd local-packages/deb
          dpkg-scanpackages "$DIST_PATH/" /dev/null > "$DIST_PATH/Packages.new"
          aws s3 cp "${AWS_S3_BUCKET}/deb/$DIST_PATH/Packages" "$DIST_PATH/Packages.current" || true
          cat "$DIST_PATH/Packages.new" "$DIST_PATH/Packages.current" > "$DIST_PATH/Packages"
          gzip -kf "$DIST_PATH/Packages"
          aws s3 cp "$DIST_PATH/$PACKAGE_NAME" "${AWS_S3_BUCKET}/deb/$DIST_PATH/"
          aws s3 cp "$DIST_PATH/Packages.gz" "${AWS_S3_BUCKET}/deb/$DIST_PATH/"
          aws s3 cp "$DIST_PATH/Packages" "${AWS_S3_BUCKET}/deb/$DIST_PATH/"

  generate-deb-release:
    if: github.ref == 'refs/heads/9.x'
    permissions:
      contents: read
    needs: [build-deb]
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        uses: actions/checkout@v6

      - name: Generate and upload Release file
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p repo/dists/stable/main

          # Download ALL Packages files from S3
          aws s3 sync "${AWS_S3_BUCKET}/deb/dists/stable/main/" repo/dists/stable/main/ --exclude "*" --include "binary-*/Packages" --include "binary-*/Packages.gz"

          cp package/deb/Release.template repo/dists/stable/Release
          sed -i "s/DATE_PLACEHOLDER/$(date -Ru)/" repo/dists/stable/Release

          # Generate checksums for all architectures
          for f in repo/dists/stable/main/binary-*/Packages repo/dists/stable/main/binary-*/Packages.gz; do
            [ -f "$f" ] && printf " %s %8d %s\n" "$(md5sum "$f"|cut -d' ' -f1)" "$(stat -c%s "$f")" "${f#repo/dists/stable/}"
          done | sed -i '/MD5Sum:/r /dev/stdin' repo/dists/stable/Release
          
          for f in repo/dists/stable/main/binary-*/Packages repo/dists/stable/main/binary-*/Packages.gz; do
            [ -f "$f" ] && printf " %s %8d %s\n" "$(sha1sum "$f"|cut -d' ' -f1)" "$(stat -c%s "$f")" "${f#repo/dists/stable/}"
          done | sed -i '/SHA1:/r /dev/stdin' repo/dists/stable/Release
          
          for f in repo/dists/stable/main/binary-*/Packages repo/dists/stable/main/binary-*/Packages.gz; do
            [ -f "$f" ] && printf " %s %8d %s\n" "$(sha256sum "$f"|cut -d' ' -f1)" "$(stat -c%s "$f")" "${f#repo/dists/stable/}"
          done | sed -i '/SHA256:/r /dev/stdin' repo/dists/stable/Release
          
          sed -i '/CHECKSUMS_PLACEHOLDER/d' repo/dists/stable/Release

          # Import GPG key and sign the Release file
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
          
          # Create detached signature (Release.gpg) for older APT versions
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --detach-sign --armor --batch --yes --pinentry-mode loopback --passphrase-fd 0 -o repo/dists/stable/Release.gpg repo/dists/stable/Release
          
          # Create inline-signed Release (InRelease) for modern APT
          echo "${{ secrets.GPG_PASSPHRASE }}" | gpg --clearsign --armor --batch --yes --pinentry-mode loopback --passphrase-fd 0 -o repo/dists/stable/InRelease repo/dists/stable/Release
          
          # Upload the Release file and both signatures
          aws s3 cp repo/dists/stable/Release "${AWS_S3_BUCKET}/deb/dists/stable/"
          aws s3 cp repo/dists/stable/Release.gpg "${AWS_S3_BUCKET}/deb/dists/stable/"
          aws s3 cp repo/dists/stable/InRelease "${AWS_S3_BUCKET}/deb/dists/stable/"

  build-rpm:
    if: github.ref == 'refs/heads/9.x'
    permissions: 
      contents: read
      packages: read
    name: build rpm ${{ matrix.package_arch }}
    needs: [version]

    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: 'amd64'
            runtime_arch: 'x64'
            package_arch: 'x86_64'
          - os: ubuntu-24.04
            architecture: 'arm64'
            runtime_arch: 'arm64'
            package_arch: 'aarch64'

    runs-on: ${{ matrix.os }}
    container:
      image: ${{ vars.RPM_COMPUTE_BUILDER_IMAGE }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.REPO_TOKEN }}

    steps:
      - name: Install dotnet 10.0
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.102'
    
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Rhino.Compute and Compute.Geometry
        run: |
          dotnet publish src/rhino.compute/rhino.compute.csproj -c Release -r linux-${{ matrix.runtime_arch }} --self-contained true -o publish/linux-${{ matrix.runtime_arch }}/rhino.compute
          dotnet publish src/compute.geometry/compute.geometry.csproj -c Release -r linux-${{ matrix.runtime_arch }} --self-contained true -o publish/linux-${{ matrix.runtime_arch }}/compute.geometry

      - name: Package (rpm)
        run: |
          VERSION="${{ needs.version.outputs.version }}"
          mkdir -p ~/rpmbuild/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          # Update spec file with dynamic version and changelog entry
          cp package/rpm/rhino-compute.spec ~/rpmbuild/SPECS

          # Replace all occurrences of 9.0.0 with dynamic version
          sed -i "s/9\.0\.0/${VERSION}/g" ~/rpmbuild/SPECS/rhino-compute.spec

          # Add changelog entry
          CHANGELOG_DATE=$(date '+%a %b %d %Y')
          CHANGELOG_ENTRY="* ${CHANGELOG_DATE} McNeel <support@mcneel.com> - ${VERSION}-1\n- Automated build"
          sed -i "/%changelog/a ${CHANGELOG_ENTRY}" ~/rpmbuild/SPECS/rhino-compute.spec

          # cp other files
          cp package/rhino-compute.service ~/rpmbuild/SOURCES/
          cp package/environment.example ~/rpmbuild/SOURCES/
          cp package/rhino-compute-start.sh ~/rpmbuild/SOURCES/

          #tarball
          tar czf ~/rpmbuild/SOURCES/rhino-compute_${VERSION}-wip.tar.gz \
          --transform "s,^,rhino-compute_${VERSION}-wip/," \
          -C . LICENSE.md \
          -C publish/linux-${{ matrix.runtime_arch }} .

          #build binary rpm
          rpmbuild -bb --target ${{ matrix.package_arch }} ~/rpmbuild/SPECS/rhino-compute.spec

          set -euo pipefail

          # Replace minimal GPG with full GPG
          sudo dnf swap -y gnupg2-minimal gnupg2

          #
          # Install required tools
          #
          sudo dnf install -y -q pinentry rpm-sign

          #
          # Configure GPG for CI
          #
          mkdir -p ~/.gnupg
          chmod 700 ~/.gnupg

          printf "pinentry-mode loopback\n" > ~/.gnupg/gpg.conf
          printf "allow-loopback-pinentry\n" > ~/.gnupg/gpg-agent.conf

          gpgconf --kill gpg-agent || true

          #
          # Import private key
          #
          printf "%s" "${{ secrets.GPG_PRIVATE_KEY }}" | \
            gpg --batch --yes \
                --pinentry-mode loopback \
                --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
                --import

          #
          # Extract actual secret key ID (robust fix)
          #
          KEYID=$(gpg --list-secret-keys --with-colons | awk -F: '/^sec/ {print $5; exit}')

          #
          # Configure RPM signing macros
          #
          printf "%%_signature gpg\n" > ~/.rpmmacros
          printf "%%_gpg_name %s\n" "$KEYID" >> ~/.rpmmacros
          printf "%%__gpg /usr/bin/gpg\n" >> ~/.rpmmacros
          printf "%%_gpg_sign_cmd_extra_args --batch --yes --pinentry-mode loopback --passphrase %s\n" \
            "${{ secrets.GPG_PASSPHRASE }}" >> ~/.rpmmacros

          #
          # Sign RPM(s)
          #
          rpmsign --addsign ~/rpmbuild/RPMS/${{ matrix.package_arch }}/*.rpm

      - name: Deploy (rpm)
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          DIST_PATH="rpm/amazonlinux/2023/${{ matrix.package_arch }}"

          NEW=local-mcneel-packages/new/${DIST_PATH}
          OLD=local-mcneel-packages/old/${DIST_PATH}
          MERGED=local-mcneel-packages/merged/${DIST_PATH}

          mkdir -p ${NEW} ${OLD}/repodata
          mv ~/rpmbuild/RPMS/${{ matrix.package_arch }}/*.rpm ${NEW}/
          createrepo_c ${NEW}/

          aws s3 sync ${AWS_S3_BUCKET}/${DIST_PATH}/repodata/ ${OLD}/repodata/

          mergerepo_c --repo ${OLD} --repo ${NEW} -o ${MERGED} --omit-baseurl

          echo "copying rpm to s3"
          aws s3 sync ${NEW}/ ${AWS_S3_BUCKET}/${DIST_PATH}/ --exclude "repodata/*"
          echo "copying repo data to s3"
          aws s3 sync ${MERGED}/repodata/ ${AWS_S3_BUCKET}/${DIST_PATH}/repodata/ --delete

  tag:
    needs: [ version, build-rpm, generate-deb-release ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/9.x'
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Tag
        run: |
          TAG="v${{ needs.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag $TAG already exists"
            exit 1
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
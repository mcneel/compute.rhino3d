# for a list of available software on the different virtual environments, please see:
# https://github.com/actions/virtual-environments/tree/main/images

name: workflow package
on: 
  workflow_dispatch:
#  schedule:
#    - cron: '0 0 1 * *'

jobs:
  version:
    if: github.ref == 'refs/heads/9.x'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version_step.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Update Version Numbers
        id: version_step
        run: ./package/version/version.sh

      - name: Upload versioned files
        uses: actions/upload-artifact@v4
        with:
          name: version-files
          path: |
            package/version/version.cs

  build:
    if: github.ref == 'refs/heads/9.x'
    name: build deb ${{ matrix.package_arch }}
    needs: version

    strategy:
      matrix:
        include:
          - os: ubuntu-24.04
            architecture: 'arch64'
            runtime_arch: 'linux-x64'
            package_arch: 'amd64'
          - os: ubuntu-24.04
            architecture: 'arm64'
            runtime_arch: 'linux-arm64'
            package_arch: 'arm64'

    runs-on: ${{ matrix.os }}

    steps:
      - name: Set up QEMU
        if: matrix.architecture == 'arm64'
        uses: docker/setup-qemu-action@v3
        with:
         platforms: arm64

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y debhelper devscripts

      - name: Install dotnet 9.0
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
    
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build
        run: |
          dotnet publish src/rhino.compute/rhino.compute.csproj -c Release -r ${{ matrix.runtime_arch }} --self-contained true -o publish/linux-${{ matrix.package_arch }}/rhino.compute
          dotnet publish src/compute.geometry/compute.geometry.csproj -c Release -r ${{ matrix.runtime_arch }} --self-contained true -o publish/linux-${{ matrix.package_arch }}/compute.geometry
          mkdir -p rhinocomputepackage/debian
          mkdir -p rhinocomputepackage/linux-${{ matrix.package_arch }}/build
          mv publish/linux-${{ matrix.package_arch }}/rhino.compute rhinocomputepackage/linux-${{ matrix.package_arch }}/build/
          mv publish/linux-${{ matrix.package_arch }}/compute.geometry rhinocomputepackage/linux-${{ matrix.package_arch }}/build/
          cp package/deb/control package/deb/rules package/deb/changelog package/deb/copyright rhinocomputepackage/debian
          cd rhinocomputepackage
          dch -v ${{ needs.version.outputs.version }}-wip "Automated build" -M -D unstable
          dpkg-buildpackage -us -uc -b -a${{ matrix.package_arch }}

      - name: Deploy
        env:
          AWS_S3_BUCKET: ${{ secrets.AWS_S3_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          DIST_PATH="dists/stable/main/binary-${{ matrix.package_arch }}"
          mkdir -p local-packages/deb/$DIST_PATH
          cp rhinocomputepackage/*.deb local-packages/deb/$DIST_PATH
          cd local-packages/deb
          dpkg-scanpackages "$DIST_PATH/" /dev/null > "$DIST_PATH/Packages.new"
          aws s3 cp "${AWS_S3_BUCKET}/deb/$DIST_PATH/Packages" "$DIST_PATH/Packages.current" || true
          cat "$DIST_PATH/Packages.new" "$DIST_PATH/Packages.current" > "$DIST_PATH/Packages"
          gzip -kf "$DIST_PATH/Packages"
          aws s3 cp "$DIST_PATH/*deb" "${AWS_S3_BUCKET}/deb/$DIST_PATH/"
          aws s3 cp "$DIST_PATH/Packages.gz" "${AWS_S3_BUCKET}/deb/$DIST_PATH/"
          aws s3 cp "$DIST_PATH/Packages" "${AWS_S3_BUCKET}/deb/$DIST_PATH/"

  tag:
    needs: [ version, build ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/9.x'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag
        run: |
          TAG="v${{ needs.version.outputs.version }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "❌ Tag $TAG already exists"
            exit 1
          fi

          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"